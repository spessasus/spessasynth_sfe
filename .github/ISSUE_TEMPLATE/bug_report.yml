name: Test problem
description: Report a test that is wrong, unclear or broken.
labels: ["bug"]
body:
    - type: checkboxes
      attributes:
          label: Duplicated issue check
          description: Please make sure that this issue has not been reported before.
          options:
              - label: I confirm that I have searched the existing issues
                required: true
    - type: input
      id: test
      attributes:
          label: Test id
          description: The id of the test, for example GEN-12, and its group (sfe4-10-generators).
      validations:
          required: true
    - type: input
      id: synthesizer
      attributes:
          label: Synthesizer
          description: The synthesizer you ran the test with, and its version.
      validations:
          required: false
    - type: textarea
      id: description
      attributes:
          label: Description
          description: What is wrong with the test? Quote the section of the SFe specification if the test contradicts it.
      validations:
          required: true
    - type: textarea
      id: expected
      attributes:
          label: Expected behavior
          description: What should the test play or expect instead?
      validations:
          required: true
    - type: dropdown
      id: kind
      attributes:
          label: Kind of problem
          options:
              - The pass criterion contradicts the specification
              - The pass criterion is unclear
              - The reference render does not match the pass criterion
              - The build fails
              - Other (please specify in the description)
      validations:
          required: false
    - type: textarea
      attributes:
          label: Additional info
          description: Any additional info and attachments (screenshots, renders, banks) go here.
      validations:
          required: false
